        e("div",null,e("label",{style:{fontSize:11,fontWeight:600,color:mu,display:"block",marginBottom:4}},"Password *"),e("input",{type:"password",value:f.password,onChange:ev=>setF(p=>({...p,password:ev.target.value})),placeholder:tab==="signup"?"Min 6 chars":"••••••••",style:inp,onKeyDown:ev=>ev.key==="Enter"&&handle()})),

function Main({user,setUser,dark,toggleDark,logout}){
